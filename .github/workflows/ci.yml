name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # A throwaway database for the Row Level Security tests (tests/rls.test.ts).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          RLS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      - run: npm run content:check

      - run: npm run build
        env:
          # Placeholder public values so the build can run without secrets.
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
